name: esbuild Windows tempfile regression

on:
  pull_request:
    paths:
      - 'patches/esbuild@*.patch'
      - 'patches/README.md'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/esbuild-tempfile.test.mjs'
      - 'scripts/fixtures/esbuild-tempfile-probe.cjs'
      - 'scripts/smoke-dev-web.mjs'
      - '.github/workflows/esbuild-tempfile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esbuild-tempfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: windows-2025
            shell: pwsh
          - os: macos-15
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:esbuild-tempfile
      - name: Reinstall and recheck patches
        run: pnpm install --frozen-lockfile --force
      - name: Regression after reinstall
        run: pnpm run test:esbuild-tempfile
      - name: Initial build, watchers and authenticated Web response
        run: node scripts/smoke-dev-web.mjs
      - run: pnpm run build:check
      - run: pnpm run build:web
      - run: pnpm run doc-sync
